<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quay Thưởng Edupia</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Curtain overlay for sides -->
    <div class="curtain curtain-left"></div>
    <div class="curtain curtain-right"></div>
    
    <div class="spotlight"></div>

    <div class="container">
        <div class="header-top">
            <div class="logo">
                <img class="brand-logo" src="logo.svg" alt="Edupia" width="270" height="74">
            </div>
            <div class="top-actions">
                <button class="btn-sm" id="exportBtn">📥 Xuất danh sách trúng thưởng</button>
                <button class="btn-sm" id="reloadBtn">🔄 Làm mới</button>
            </div>
        </div>

        <div class="header">
            <h2 class="program-title">HỌC CHĂM - HỌC VUI</h2>
            <h1>🎊 QUAY THƯỞNG 🎊</h1>
        </div>
        
        <div class="machine-container">
            <div class="slot-machine">
                <div class="marquee-lights" id="lights-top"></div>
                <div class="marquee-lights" id="lights-bottom"></div>
                <div class="marquee-lights-v" id="lights-left"></div>
                <div class="marquee-lights-v" id="lights-right"></div>
                
                <div class="slots">
                    <div class="slot"><div class="slot-inner" id="slot-0">0</div></div>
                    <div class="slot"><div class="slot-inner" id="slot-1">0</div></div>
                    <div class="slot"><div class="slot-inner" id="slot-2">0</div></div>
                    <div class="slot"><div class="slot-inner" id="slot-3">0</div></div>
                    <div class="slot"><div class="slot-inner" id="slot-4">0</div></div>
                    <div class="slot"><div class="slot-inner" id="slot-5">0</div></div>
                </div>
            </div>
        </div>
        
        <section id="presenterLogin" class="presenter-login" aria-labelledby="presenterTitle">
            <h2 id="presenterTitle">Đăng nhập người điều khiển</h2>
            <div class="login-row">
                <label>Tài khoản <input id="presenterUsername" autocomplete="username" value="admin"></label>
                <label>Mật khẩu <input id="presenterPassword" type="password" autocomplete="current-password"></label>
                <button id="presenterLoginBtn" class="btn-sm">Đăng nhập</button>
            </div>
            <p id="presenterLoginMessage" class="status-msg" aria-live="polite"></p>
        </section>

        <div id="winnerNameDisplay" class="winner-name-display hidden" aria-live="polite">
            <span class="emoji">🎉</span> <span id="wName"></span> <span class="emoji">🎉</span>
        </div>
        
        <div class="controls">
            <div class="spin-actions" style="display: flex; gap: 10px; align-items: center;">
                <select id="spinCount" class="form-control" style="width: auto; padding: 10px; border-radius: 8px; font-weight: bold; background: #fff; color: #333; cursor: pointer; border: 2px solid var(--gold);">
                    <option value="1">1 người</option>
                    <option value="2">2 người</option>
                    <option value="5">5 người</option>
                    <option value="10">10 người</option>
                </select>
                <button id="spinBtn" class="btn-spin" aria-busy="false">
                    <span class="btn-text">🎯 QUAY NGAY</span>
                    <span class="spinner" role="status" style="display:none;" aria-label="Đang tải"></span>
                </button>
            </div>
            <div class="status-msg" id="message" aria-live="polite"></div>
            
            <div id="winnerSmallInfo" class="winner-small-info hidden">
                Mã <span id="wSmallCode"></span> — <span id="wSmallName"></span>
            </div>

            <div class="sound-control" style="margin-top: 15px;">
                <input type="checkbox" id="soundToggle" checked>
                <label for="soundToggle">🔊 Âm thanh</label>
            </div>
        </div>

        <div class="winners-section">
            <div class="winners-header">
                <h3>🏆 Danh sách trúng thưởng</h3>
                <span id="winnersCount">(0 người)</span>
            </div>
            <div class="winners-grid" id="winnersList" aria-live="polite" aria-busy="false">
                <!-- Winner cards injected here -->
            </div>
        </div>
    </div>
    
    <!-- Hiệu ứng chữ chúc mừng bay lên giữa màn hình -->
    <div id="hugeCongrats" class="huge-congrats">CHÚC MỪNG!</div>

    <!-- Modal cho nhiều giải -->
    <div id="batchWinModal" class="modal hidden">
        <div class="modal-content">
            <h2 class="modal-title">🎉 CHÚC MỪNG NGƯỜI TRÚNG THƯỞNG 🎉</h2>
            <div id="batchWinnersList" class="batch-winners-grid"></div>
            <div style="display: flex; justify-content: center; gap: 15px; margin-top: 20px; flex-wrap: wrap;">
                <button id="copyBatchWinnersBtn" class="btn-spin" style="padding: 12px 25px; font-size: 1.1rem; background: linear-gradient(180deg, #2ecc71 0%, #27ae60 100%); color: #fff; box-shadow: 0 4px 0 #1e8449;">📋 Sao chép danh sách</button>
                <button id="closeBatchModal" class="btn-spin" style="padding: 12px 35px; font-size: 1.1rem;">Đóng</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
